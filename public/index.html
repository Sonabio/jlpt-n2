<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B428F" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="JLPT N2">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Luyện đề JLPT N2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sổ học trên giấy kẻ ô genkō — thanh bên trái (máy tính) / thanh dưới (điện thoại), nội dung một cột tối đa 1040px */
:root {
  --bg: #F2F3F7; --paper: #FFFFFF; --ink: #1B2140; --muted: #5E6480; --line: #DCDFEA; --grid: #E7EAF3;
  --ai: #2B428F; --ai-soft: #E4E9F7; --shu: #C8402A; --shu-soft: #FBE7E2;
  --good: #2E7D56; --good-soft: #E1F2E8; --warn: #A86A12; --bad: #B23A3A; --bad-soft: #F8E3E3;
  --f-body: "Be Vietnam Pro", "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-jp: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Be Vietnam Pro", sans-serif;
  --f-card: "Klee One", "Zen Kaku Gothic New", "Hiragino Mincho ProN", serif;
  --r: 10px; --shadow: 0 1px 2px rgb(20 30 70 / .06), 0 4px 14px rgb(20 30 70 / .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1220; --paper: #171B2C; --ink: #E6E8F2; --muted: #9BA1BC; --line: #2A3048; --grid: #20263B;
  --ai: #93A8FF; --ai-soft: #222B4D; --shu: #FF8466; --shu-soft: #3A2220;
  --good: #6BCB98; --good-soft: #17322A; --warn: #E7B45A; --bad: #FF8C8C; --bad-soft: #3A1E24;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1220; --paper: #171B2C; --ink: #E6E8F2; --muted: #9BA1BC; --line: #2A3048; --grid: #20263B;
  --ai: #93A8FF; --ai-soft: #222B4D; --shu: #FF8466; --shu-soft: #3A2220;
  --good: #6BCB98; --good-soft: #17322A; --warn: #E7B45A; --bad: #FF8C8C; --bad-soft: #3A1E24;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
[lang="ja"] { font-family: var(--f-jp); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: clamp(1.45rem, 3.4vw, 1.9rem); font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--ai); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .84rem; }
.center { text-align: center; }
mark { background: var(--shu-soft); color: var(--shu); border-radius: 3px; padding: 0 2px; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

/* shell */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--paper); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand .seal { width: 38px; height: 38px; border: 2px solid var(--shu); color: var(--shu); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-card); font-weight: 600; font-size: 1.05rem; transform: rotate(-8deg); flex: none; }
.brand b { display: block; font-size: .98rem; }
.brand small { color: var(--muted); font-size: .76rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nv { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.nv:hover { background: var(--ai-soft); }
.nv.on { background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.nvj { font-size: .8rem; color: var(--muted); width: 2.2em; }
.nv.on .nvj { color: var(--ai); }
.badge { margin-left: auto; background: var(--shu); color: #fff; border-radius: 999px; font-size: .7rem; padding: 0 7px; line-height: 1.6; font-weight: 600; font-variant-numeric: tabular-nums; }
.syncmini { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); padding: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot[data-m="cloud"] { background: var(--good); } .dot[data-m="error"] { background: var(--bad); } .dot[data-m="local"] { background: var(--warn); }
.main { min-width: 0; padding-block: 26px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#view { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 861px) { .main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: auto 0 0 0; top: auto; height: auto; z-index: 20; flex-direction: row; padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--line); gap: 0; }
  .brand, .syncmini { display: none; }
  .nav { flex-direction: row; flex: 1; justify-content: space-around; }
  .nv { flex: 1; flex-direction: column; align-items: center; gap: 0; padding: 7px 2px 6px; border-radius: 0; font-size: .7rem; min-width: 0; }
  .nv.on { background: transparent; }
  .nv.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ai); }
  .nvj { width: auto; font-size: 1rem; line-height: 1.3; color: var(--ink); }
  .nvv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .badge { position: absolute; top: 3px; right: 12%; margin: 0; font-size: .62rem; padding: 0 5px; }
  .main { padding-block: 18px calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* blocks */
.pt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pt span { font-size: .6em; color: var(--muted); font-weight: 500; }
.sh { margin-top: 6px; display: flex; gap: 10px; align-items: baseline; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph.sm h3 { font-size: .92rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.center { justify-content: center; }
.tag { font-size: .74rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.tag.on { color: var(--ai); border-color: var(--ai); }
.lv { font-size: .7rem; font-weight: 700; color: var(--ai); background: var(--ai-soft); border-radius: 4px; padding: 1px 6px; letter-spacing: .03em; white-space: nowrap; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.lnk { font-size: .88rem; }

.btn { font: inherit; font-size: .92rem; font-weight: 500; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 9px 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.btn:hover { border-color: var(--ai); }
.btn.pri { background: var(--ai); border-color: var(--ai); color: var(--paper); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ai); }
.btn.ghost:hover { background: var(--ai-soft); }
.btn.sm { padding: 5px 11px; min-height: 32px; font-size: .84rem; }
.btn.wide { width: 100%; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
.lnkb { font: inherit; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; text-align: left; }
.lnkb:hover { color: var(--ai); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; max-width: 100%; }
.seg button { font: inherit; font-size: .85rem; border: 0; background: var(--paper); color: var(--ink); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ai); color: var(--paper); }
.seg.sm button { padding: 3px 9px; font-size: .78rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip.on { background: var(--ai-soft); border-color: var(--ai); color: var(--ai); }
select, input[type=text], input[type=search], input[type=number], input[type=date], input:not([type]), textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
textarea { width: 100%; resize: vertical; font-size: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; color: var(--muted); }
.fld select, .fld input { color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: .92rem; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ai); flex: none; }
.check.big { font-size: 1rem; font-weight: 500; }
.check.today { font-weight: 600; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* today */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; padding: 4px 0 6px; }
.hero-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
.hero h1 span { color: var(--muted); font-weight: 500; font-size: .72em; display: block; margin-top: 2px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--shu); font-weight: 600; }
.count { display: grid; grid-template-columns: auto auto auto; align-items: baseline; gap: 2px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 18px; }
.count-n { font-family: var(--f-card); font-size: 2.8rem; line-height: 1; color: var(--shu); font-weight: 600; font-variant-numeric: tabular-nums; }
.count-l { font-size: 1rem; color: var(--muted); }
.count-d { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { display: flex; flex-direction: column; border-left: 2px solid var(--line); padding-left: 10px; }
.kpis b { font-size: 1.7rem; line-height: 1.15; font-weight: 600; }
.kpis span { font-size: .78rem; color: var(--muted); }
.sess { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.blocks li { display: grid; grid-template-columns: 36px 1fr; column-gap: 8px; font-size: .9rem; padding: 4px 8px; border-radius: 6px; }
.blocks li b { grid-row: span 2; color: var(--ai); font-variant-numeric: tabular-nums; }
.blocks small { color: var(--muted); font-size: .78rem; }
.blocks li.cur { background: var(--ai-soft); }
.blocks li.past { opacity: .5; }
.timer-s { font-size: 1.3rem; font-weight: 600; color: var(--ai); }
.done-msg { color: var(--good); font-weight: 500; }
.streak b { font-size: 1.5rem; color: var(--shu); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 96px; align-items: end; }
.bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.bar i { width: 100%; max-width: 18px; background: var(--ai-soft); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar.now i { background: var(--ai); }
.bar span { font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stages li { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; font-size: .88rem; }
.sn { font-weight: 600; }
.stages li.cur .sn { color: var(--shu); }
.sbar, .dk-bar, .rv-prog, .cbar { height: 6px; background: var(--grid); border-radius: 99px; overflow: hidden; display: flex; position: relative; }
.sbar i, .rv-prog i { background: var(--ai); display: block; }
.stages li.done .sbar i { background: var(--good); }
.sp { text-align: right; color: var(--muted); }

/* review */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.dk { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.dk-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dk-h b { font-weight: 600; font-size: .94rem; }
.dk-bar i.m { background: var(--ai); } .dk-bar i.s { background: color-mix(in srgb, var(--ai) 35%, transparent); }
.dk-f { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.dk-f .btn { margin-left: auto; }
.due { color: var(--shu); font-weight: 600; }
.rv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rv-prog i { transition: width .25s; }
.new { color: var(--shu); }
.flash {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: center;
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  min-height: min(52vh, 380px); padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; cursor: pointer;
}
.flash.flipped { cursor: default; justify-content: flex-start; }
.cf { font-family: var(--f-card); font-size: clamp(3.6rem, 16vw, 6.5rem); line-height: 1.1; font-weight: 600; background: var(--paper); padding: 0 10px; border-radius: 8px; max-width: 100%; overflow-wrap: anywhere; }
.cf.small { font-size: clamp(1.5rem, 6vw, 2.3rem); }
.cf.vi { font-family: var(--f-body); font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 600; }
.cf small { display: block; font-size: .5em; color: var(--muted); font-weight: 400; }
.flipped .cf { font-size: clamp(2.4rem, 10vw, 4rem); }
.flipped .cf.small { font-size: clamp(1.3rem, 5vw, 1.9rem); }
.tap { color: var(--muted); font-size: .84rem; background: var(--paper); padding: 2px 8px; border-radius: 6px; }
.cb { background: var(--paper); border-top: 2px solid var(--shu); width: min(100%, 560px); padding: 14px 6px 4px; display: flex; flex-direction: column; gap: 8px; }
.cb-main { font-size: 1.6rem; font-weight: 600; }
.cb-r { color: var(--muted); }
.cb-m { font-size: 1.3rem; font-weight: 600; color: var(--ai); }
.cb-n { color: var(--muted); font-size: .92rem; }
.cb-x { font-size: 1.05rem; background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.rv-act { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.g { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; }
.g b { font-weight: 600; } .g span { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.g1 { border-color: var(--bad); } .g1 b { color: var(--bad); }
.g2 b { color: var(--warn); } .g3 { border-color: var(--ai); } .g3 b { color: var(--ai); } .g4 b { color: var(--good); }
.g:hover { background: var(--bg); }
.stamp { display: inline-grid; place-items: center; width: 76px; height: 76px; border: 3px solid var(--shu); color: var(--shu); border-radius: 50%; font-family: var(--f-card); font-weight: 600; font-size: 1.6rem; transform: rotate(-10deg); margin: 0 auto 6px; letter-spacing: -.04em; }
.stamp.grey { border-color: var(--muted); color: var(--muted); }
.panel.center { align-items: center; }

/* practice */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.mode { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mh { display: flex; align-items: baseline; gap: 10px; }
.mj { font-family: var(--f-card); color: var(--shu); font-size: 1.05rem; font-weight: 600; min-width: 3.2em; }
.mode p { color: var(--muted); font-size: .88rem; }
.mf { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; }
.qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.qs { font-size: 1.3rem; line-height: 1.7; }
.qs.big { font-size: 2rem; font-family: var(--f-card); font-weight: 600; }
.qs.huge { font-size: 3.6rem; font-family: var(--f-card); font-weight: 600; line-height: 1.2; }
.qsub { color: var(--muted); }
.blank { color: var(--shu); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.opt { font: inherit; font-size: 1.02rem; text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 52px; }
.opt[lang="ja"] { font-family: var(--f-jp); font-size: 1.1rem; }
.opt:hover:not(:disabled) { border-color: var(--ai); }
.ok-n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); font-size: .72rem; display: grid; place-items: center; color: var(--muted); flex: none; font-family: var(--f-body); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrongp { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.opt:disabled { cursor: default; color: var(--ink); }
.expl { border-radius: 10px; padding: 12px 14px; font-size: .95rem; border-left: 3px solid; }
.expl.good { background: var(--good-soft); border-color: var(--good); }
.expl.bad { background: var(--bad-soft); border-color: var(--bad); }
.wrong { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.wi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.wi .qs { font-size: 1.05rem; } .wi .qs.big, .wi .qs.huge { font-size: 1.4rem; }
.wi .ok { color: var(--good); font-weight: 600; } .wi .exp { color: var(--muted); font-size: .88rem; }

/* lookup */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { font: inherit; font-size: .9rem; border: 0; background: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--ai); border-bottom-color: var(--ai); font-weight: 600; }
.search input { width: 100%; }

/* FSRS-4.5 cho thẻ cụm từ. Trạng thái: [due, ivl, D, S, reps, lapses, lastReview] */
const FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const F_DECAY = -0.5, F_FACTOR = 19 / 81;
const clampD = d => Math.min(10, Math.max(1, d));
const fD0 = g => clampD(FW[4] - (g - 3) * FW[5]);
const fIvl = st => Math.max(1, Math.min(3650, Math.round(st / F_FACTOR * (Math.pow(0.9, 1 / F_DECAY) - 1))));
function sched(st, g) {
  const dn = dayNum(); let D, Sx, reps = 0, lap = 0, last = dn; const fresh = !st;
  if (st) { D = st[2]; Sx = st[3]; reps = st[4]; lap = st[5]; last = st[6]; }
  let nD, nS;
  if (fresh) { nS = FW[g - 1]; nD = fD0(g); }
  else {
    const t = Math.max(0, dn - last), R = Math.pow(1 + F_FACTOR * t / Sx, F_DECAY);
    nD = clampD(FW[7] * fD0(3) + (1 - FW[7]) * (D - FW[6] * (g - 3)));
    if (g === 1) { nS = Math.min(Sx, FW[11] * Math.pow(D, -FW[12]) * (Math.pow(Sx + 1, FW[13]) - 1) * Math.exp(FW[14] * (1 - R))); lap++; }
    else nS = Sx * (Math.exp(FW[8]) * (11 - D) * Math.pow(Sx, -FW[9]) * (Math.exp(FW[10] * (1 - R)) - 1) * (g === 2 ? FW[15] : 1) * (g === 4 ? FW[16] : 1) + 1);
  }
  nS = +Math.max(0.1, nS).toFixed(4); nD = +nD.toFixed(3);
  if (g === 1) return [dn, 0, nD, nS, reps, lap, dn];
  const ivl = fIvl(nS); return [dn + ivl, ivl, nD, nS, reps + 1, lap, dn];
}

/* File của một đề: N2 là 1 PDF + 1 MP3; đề chính thức N3–N5 là nhiều PDF (theo bài thi) và MP3 theo từng 問題 */

      if (!content.sets) throw new Error('File ' + jf.name + ' không đúng định dạng');
      const slot = SLOTS.includes(content.slot) ? content.slot : 'main';
      if (!bySlot[slot] || nItemsOf(content) > nItemsOf(bySlot[slot].content)) bySlot[slot] = { content, txt };
    }
    const contents = [];
    for (const [slot, { content, txt }] of Object.entries(bySlot)) {
      IMP.msg = 'Đang lưu nội dung bài tập vào máy…'; render();
      CS[slot] = content; CS[slot].upd = Date.now(); await saveContentLocal(slot);
      if (CF.cfg) { try { await CF.call('/content' + (slot === 'main' ? '' : '?slot=' + slot), { method: 'PUT', body: { data: txt } }); } catch (e) { IMP.err = 'Chưa gửi được nội dung lên cloud: ' + (e.message || e); } }
      contents.push(content);
    }

    else if (allSets().length || allExams().length) contents.push({ sets: allSets(), exams: allExams() });
    if (!contents.length) throw new Error('Không thấy file content-*.json trong thư mục đã chọn.');
    const norm = s => s.normalize('NFC').replace(/\\/g, '/').toLowerCase();

    contents.forEach(content => {
      content.sets.forEach(s => s.items.forEach(it => { if (!it.audio) return; const f = find(it.audio); if (f) jobs.push([it.id, f, 'audio/mpeg']); }));
      (content.exams || []).forEach(e => exFiles(e).forEach(([k, rel, type]) => { const f = find(rel); if (f) jobs.push([exAsset(e.id, k), f, type]); }));
    });

    // bộ chỉ có chữ (không cần MP3/PDF, vd 26 đề N3) thì không có file nào để lưu — báo nhập xong, không báo lỗi
    const needFiles = contents.some(c => c.sets.some(s => s.items.some(it => it.audio)) || (c.exams || []).length);
    if (!jobs.length) IMP.msg = needFiles ? 'Không thấy file khớp. Hãy chọn đúng thư mục tài liệu (xem hướng dẫn bên dưới).' : `Xong: đã lưu ${contents.reduce((a, c) => a + nItemsOf(c), 0)} câu vào máy (bộ này không cần file nghe/PDF).`;
    if (todo.length) await askPersist();
    for (const [id, f, type] of todo) {          // lần lượt từng file để không tốn bộ nhớ

      catch (e) { IMP.fail.push(id); IMP.err = /quota/i.test(String(e && (e.name || e.message))) ? 'Ổ đĩa/trình duyệt hết chỗ' : (e.message || String(e)); }

    }

        ok++;

    <details class="panel"><summary><h2>Nghe hiểu (${D.papers[D.papers.length - 1].min}′)</h2></summary><div class="tbl"><table><thead><tr><th>問題</th><th>Dạng</th><th>Câu</th><th>Mẹo</th></tr></thead><tbody>${Object.keys(D.lis).map(m => `<tr><td>${m}</td><td lang="ja">${D.lis[m].ja}</td><td>${D.lis[m].n}</td><td>${esc(D.lis[m].tip)}</td></tr>`).join('')}</tbody></table></div></details></section>`;
};
ACT.exDel = t => { S.exams = S.exams.filter(x => x.id !== t.dataset.v); S.exdel = [...new Set([...(S.exdel || []), t.dataset.v])]; save(); render(); };
/* ===== NGỮ PHÁP: tra cứu + bài tập (dữ liệu tự soạn ở grammar-data.js) =====
   Mỗi mẫu có 2 câu luyện, id cố định:  gc:N5:12 = chọn mẫu đúng (文法形式の判断),  go:N5:12 = sắp xếp câu ★ (文の組み立て).
   Lần làm ghi vào S.att như câu nghe/đọc → câu sai vào Điểm yếu, lặp 1→3→7→21 ngày.
   Đánh dấu ★ = tạo thẻ trong S.phr (có gk) → ôn bằng FSRS ở Ôn nhanh. */

/* ----- đọc dữ liệu ----- */
function grList(lv) {
  const c = grList.c || (grList.c = {});
  if (!c[lv]) c[lv] = (GRAM[lv] || []).map(r => ({ key: lv + ':' + r[0], lv, id: +r[0], g: r[1], p: r[2], c: r[3], m: r[4], x: r[5], v: r[6], d: r[7].split(';'), n: r[8] || '' }));
  return c[lv];
}
function grByKey(key) { const lv = key.split(':')[0]; return grList(lv).find(g => g.key === key); }
function grPlain(x) { return x.replace(/[{}\[\]\/]/g, ''); }
function grAnsText(x) { return x.match(/\[([^\]]*)\]/)[1]; }
/* Ví dụ: chỗ trống được tô màu */
function grExHTML(x) { return esc(x.replace(/[{}\/]/g, '')).replace(/\[([^\]]*)\]/, '<b class="blank">$1</b>'); }
/* Trộn cố định theo khóa (mỗi câu luôn ra cùng thứ tự đáp án, để làm lại/đồng bộ khớp nhau) */
function grSeed(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return () => { h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function grShuffle(a, key) { const r = grSeed(key); a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Câu "chọn mẫu đúng": câu có （　　）, 4 lựa chọn */
function grChoose(g) {
  const ans = grAnsText(g.x), opts = grShuffle([ans, ...g.d], 'c' + g.key);
  return { q: g.x.replace(/[{}\/]/g, '').replace(/\[[^\]]*\]/, '（　　）'), opts, ans: opts.indexOf(ans) + 1 };
}
/* Câu "sắp xếp ★": phần trước + 4 ô (★ ở 1 ô) + phần sau; 4 mảnh xáo trộn */
function grOrder(g) {
  const m = g.x.match(/^([^{]*)\{([^}]*)\}(.*)$/), clean = s => s.replace(/[\[\]]/g, '');
  const chunks = m[2].split('/').map(clean);
  let opts = grShuffle(chunks, 'o' + g.key);
  if (opts.every((c, i) => c === chunks[i])) opts = [opts[1], opts[0], opts[3], opts[2]];
  const star = grSeed('s' + g.key)() * 4 | 0;
  return { pre: clean(m[1]), post: clean(m[3]), chunks, opts, star, ans: opts.indexOf(chunks[star]) + 1 };
}

/* Cấp luyện ngữ pháp: cấp đang chọn ở Tra cứu (vd N1 — cấp chưa có ở thanh cấp chung), không thì cấp đang học */
function grPLv() { return GL && GL.lv && GRAM[GL.lv] ? GL.lv : curLv(); }   // GL chưa có khi content.js gọi grIndex lúc khởi động
/* Đưa câu luyện của cấp đang học (+ cấp luyện ngữ pháp) vào ITEM (để Điểm yếu, Ôn nhanh dùng chung) — gọi từ indexContent */
function grIndex() {
  for (const k in ITEM) if (ITEM[k].kind === 'G') delete ITEM[k];
  [...new Set([curLv(), grPLv()])].flatMap(grList).forEach(g => {
    ITEM['gc:' + g.key] = { id: 'gc:' + g.key, kind: 'G', type: 'GC', gk: g.key, ans: [grChoose(g).ans], nopt: 4 };
    ITEM['go:' + g.key] = { id: 'go:' + g.key, kind: 'G', type: 'GO', gk: g.key, ans: [grOrder(g).ans], nopt: 4 };
  });
}
function grLabel(it) { const g = grByKey(it.gk); return `Ngữ pháp ${g ? g.lv + ' · ' + g.p : it.gk} · ${it.type === 'GC' ? 'chọn mẫu' : 'sắp xếp'}`; }
function grStarred(key) { return Object.keys(S.phr).find(id => S.phr[id].gk === key); }

/* ----- một câu hỏi (dùng chung cho trang Ngữ pháp và Ôn nhanh) -----
   q = { id, pick (câu chọn), seq: [số lựa chọn theo thứ tự ô] (câu sắp xếp), shown } */
function grQHTML(q) {
  const it = ITEM[q.id], g = grByKey(it.gk); if (!g) return '<p class="muted">Không tìm thấy mẫu này.</p>';
  let body;
  if (it.type === 'GC') {
    const c = grChoose(g);
    body = `<p class="glbl">Chọn từ thích hợp điền vào （　　）</p><p class="qs" lang="ja">${esc(c.q)}</p>
      <div class="opts">${c.opts.map((o, j) => { const v = j + 1, cls = q.shown ? (v === c.ans ? ' right' : q.pick === v ? ' wrongp' : ' dim') : ''; return `<button class="opt${cls}" data-a="gqPick" data-v="${v}" ${q.shown ? 'disabled' : ''}><span class="ok-n">${v}</span><span lang="ja">${esc(o)}</span></button>`; }).join('')}</div>`;
  } else {
    const o = grOrder(g), seq = q.seq || [];
    const slot = i => { const v = seq[i]; const cls = i === o.star ? ' star' : ''; return `<span class="gslot${cls}${v ? ' fill' : ''}">${v ? esc(o.opts[v - 1]) : i === o.star ? '★' : ''}</span>`; };
    body = `<p class="glbl">Sắp xếp 4 mảnh cho đúng câu. Mảnh nào nằm ở ô ★?</p>
      <p class="qs gord" lang="ja">${esc(o.pre)}${[0, 1, 2, 3].map(slot).join('')}${esc(o.post)}</p>
      <div class="opts">${o.opts.map((t, j) => { const v = j + 1, used = seq.includes(v), cls = q.shown ? (v === o.ans ? ' right' : seq[o.star] === v ? ' wrongp' : ' dim') : used ? ' dim' : ''; return `<button class="opt${cls}" data-a="gqTap" data-v="${v}" ${q.shown || used ? 'disabled' : ''}><span class="ok-n">${v}</span><span lang="ja">${esc(t)}</span></button>`; }).join('')}</div>
      ${q.shown ? '' : `<div class="row"><button class="btn ghost sm" data-a="gqUndo" ${seq.length ? '' : 'disabled'}>Xóa mảnh cuối</button><button class="btn pri" data-a="gqCheck" ${seq.length === 4 ? '' : 'disabled'}>Kiểm tra</button></div>`}`;
  }
  if (!q.shown) return body;
  const ok = grQOk(q, it);
  return body + `<div class="expl ${ok ? 'good' : 'bad'}"><b>${ok ? 'Đúng' : 'Sai'}</b> · đáp án ${CIRC[it.ans[0] - 1]}${it.type === 'GO' && ok && !grFullOk(q, g) ? ' (★ đúng, nhưng thứ tự các ô khác chưa đúng)' : ''}</div>
    <div class="gcard"><p class="gp" lang="ja"><b>${esc(g.p)}</b> <span class="muted">${esc(g.c)}</span></p><p>${esc(g.m)}</p>
    <p lang="ja">${grExHTML(g.x)} <button class="btn ghost sm" data-a="grSpeak" data-v="${esc(g.key)}" aria-label="Nghe câu ví dụ">🔊</button></p><p class="muted">${esc(g.v)}</p>${g.n ? `<p class="exnote">${esc(g.n)}</p>` : ''}
    <div class="row">${grStarBtn(g.key)}</div></div>${whyChips(it.id)}`;
}
function grQOk(q, it) { return it.type === 'GC' ? q.pick === it.ans[0] : (q.seq || [])[grOrder(grByKey(it.gk)).star] === it.ans[0]; }
function grFullOk(q, g) { const o = grOrder(g); return (q.seq || []).every((v, i) => o.opts[v - 1] === o.chunks[i]); }
function grStarBtn(key) { const on = grStarred(key); return `<button class="btn sm ${on ? 'pri' : ''}" data-a="grStar" data-v="${esc(key)}">${on ? '★ Đang ôn (bấm để bỏ)' : '☆ Đánh dấu cần ôn'}</button>`; }
/* Câu hỏi hiện tại: ở trang Ôn nhanh thì nằm trong DR, ở trang Ngữ pháp thì trong GP */
function gqCur() { return route === 'drill' && DR && DR.gq ? DR.gq : GP && GP.q; }
function gqDone(q) {
  const it = ITEM[q.id], ok = grQOk(q, it);
  rec(q.id, it.type === 'GC' ? [q.pick] : q.seq, ok, (Date.now() - q.t0) / 1000, 0);
  q.shown = true;
  if (route === 'drill' && DR && DR.gq === q) DR.res.push(ok); else if (GP) GP.res.push([q.id, ok]);
  render();
}

/* ----- phiên luyện trên trang Ngữ pháp ----- */
let GP = null;   // { ids, i, q, res, label, done }
var GL = { lv: null, q: '', gr: 'all', open: null };   // var: grIndex có thể chạy trước dòng này lúc khởi động
/* Thống kê 1 dạng (GC/GO) chỉ trong 1 cấp */
function grStats(t, lv) {
  const its = typeItems(t).filter(i => i.gk.startsWith(lv + ':')), done = its.filter(i => attempts(i.id).length);
  return { total: its.length, done: done.length, lastPct: pct(done.filter(i => ist(i.id).last).length, done.length) };
}
function grStart(ids, label) {
  if (!ids.length) { toast('Không có câu nào'); return; }
  GP = { ids, i: 0, res: [], label, done: false, q: { id: ids[0], t0: Date.now() } };
  if (route !== 'grammar') go('grammar'); else { render(); scrollTo(0, 0); }
}
/* Chọn n câu: ưu tiên câu chưa làm, rồi câu làm lâu nhất */
function grPick(kind, n, keys) {
  const lv = grPLv(), gs = keys ? keys.map(grByKey).filter(Boolean) : grList(lv);
  const ids = gs.flatMap(g => kind === 'mix' ? ['gc:' + g.key, 'go:' + g.key] : [(kind === 'GC' ? 'gc:' : 'go:') + g.key]);
  const fresh = shuffle(ids.filter(id => !attempts(id).length)), old = ids.filter(id => attempts(id).length).sort((a, b) => attempts(a).slice(-1)[0][0] - attempts(b).slice(-1)[0][0]);
  return [...fresh, ...old].slice(0, n);
}
function grWeakDue() { return weakDue().filter(id => ITEM[id].kind === 'G'); }

VIEWS.grammar = () => {
  if (GP && !GP.done) return gpView();
  if (GP && GP.done) return gpSummary();
  const lv = grPLv(), list = grList(lv), wd = grWeakDue();

  // cấp tra cứu: mặc định theo cấp đang học (nếu cấp đó chưa có dữ liệu thì xem tất cả)
  const practice = list.length ? `<section class="panel"><div class="ph"><h2>Luyện tập ${lv}</h2><span class="muted num">${list.length} mẫu</span></div>
      ${lv !== curLv() ? `<p class="hint">Đang luyện ngữ pháp ${lv} (chọn ở phần Tra cứu bên dưới). Bấm lại nút ${lv} để về ${curLv()}.</p>` : ''}
      ${wd.length ? `<div class="adv"><div><b>${wd.length} câu ngữ pháp sai</b> đến hạn làm lại</div><button class="btn pri sm" data-a="grRun" data-v="weak">Làm lại câu sai</button></div>` : ''}
      <div class="mdgrid">
        <div class="mdc"><b lang="ja">文法形式の判断</b><span class="muted">Chọn mẫu đúng điền vào chỗ trống</span>${sc.done ? `<span class="num">${sc.lastPct}% đúng · ${sc.done}/${sc.total} câu</span>` : `<span class="muted">${sc.total} câu · chưa làm</span>`}<button class="btn sm" data-a="grRun" data-v="GC">10 câu</button></div>
        <div class="mdc"><b lang="ja">文の組み立て ★</b><span class="muted">Sắp xếp câu, tìm mảnh ở ô ★</span>${so.done ? `<span class="num">${so.lastPct}% đúng · ${so.done}/${so.total} câu</span>` : `<span class="muted">${so.total} câu · chưa làm</span>`}<button class="btn sm" data-a="grRun" data-v="GO">10 câu</button></div>
        <div class="mdc"><b>Trộn 2 dạng</b><span class="muted">Giống phần ngữ pháp trong đề</span><span class="muted">&nbsp;</span><button class="btn sm" data-a="grRun" data-v="mix">15 câu</button></div>
        ${starKeys.length ? `<div class="mdc"><b>Mẫu đã đánh dấu ★</b><span class="muted">${starKeys.length} mẫu</span><span class="muted">&nbsp;</span><button class="btn sm" data-a="grRun" data-v="star">Luyện</button></div>` : ''}
      </div>
      <p class="hint">Câu sai vào Điểm yếu và được lặp lại 1 → 3 → 7 → 21 ngày. Mẫu đánh dấu ★ hiện trong Ôn nhanh (thẻ lật, trên điện thoại).</p></section>`
    : `<section class="panel"><h2>Ngữ pháp ${lv}: đang soạn</h2><p class="muted">Hiện đã có N5, N4, N3, N2 và N1. Vẫn tra cứu được các cấp khác ở dưới.</p></section>`;
  const kpanel = kparts.length ? `<section class="panel"><div class="ph"><h2>Bài ngữ pháp trong tài liệu</h2></div><p class="hint">Bài lấy từ tài liệu đã nhập (Dũng Mori, đề luyện…), làm ở màn hình Luyện đọc.</p>
      <div class="mdgrid">${kparts.map(({ p, n }) => { const st = typeStats('K' + p.md); return `<div class="mdc"><b lang="ja">${esc(typeName('K' + p.md))}</b><span class="muted">${esc(p.vi)} · ${n} câu</span>${st.done ? `<span class="num">${st.lastPct}% đúng</span>` : '<span class="muted">chưa làm</span>'}<button class="btn sm" data-a="rpK" data-v="${p.md}">3 bài</button></div>`; }).join('')}</div></section>` : '';
  return `<h1 class="pt">Ngữ pháp <span lang="ja">文法</span></h1>${lvSwitchHTML()}
  ${practice}${kpanel}
  <section class="panel"><div class="ph"><h2>Tra cứu</h2></div>

    <div id="grlist" class="glist">${grListHTML()}</div></section>`;
};
/* Danh sách tra cứu (vẽ lại riêng khi gõ tìm, để ô tìm kiếm không mất con trỏ) */
function grNorm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/\s+/g, ''); }   // bỏ dấu cách: gõ "をよそに" vẫn ra "を よそに"
function grListHTML() {
  const glv = grLvNow(), lvs = glv === 'all' ? Object.keys(GRAM) : [glv], q = grNorm(GL.q.trim());
  const rows = lvs.flatMap(grList).filter(g => (GL.gr === 'all' || g.g === GL.gr) && (!q || grNorm([g.p, g.c, g.m, grPlain(g.x), g.v, g.n].join(' ')).includes(q)));
  if (!rows.length) return '<p class="muted">Không tìm thấy mẫu nào.</p>';
  return `<p class="hint">${rows.length} mẫu</p>` + rows.slice(0, 300).map(g => {
    const h = [...attempts('gc:' + g.key), ...attempts('go:' + g.key)].sort((a, b) => a[0] - b[0]).slice(-6);
    return `<details class="grow" ${GL.open === g.key ? 'open' : ''} data-k="${esc(g.key)}"><summary><span class="glv">${g.lv}</span><b lang="ja">${esc(g.p)}</b><span class="gm">${esc(g.m)}</span>${grStarred(g.key) ? '<span class="gstar" title="Đang ôn">★</span>' : ''}${h.length ? `<span class="num ghist">${h.map(a => a[2] ? '<span class="okc">○</span>' : '<span class="ngc">✕</span>').join('')}</span>` : ''}</summary>
      <div class="gcard"><p><span class="muted">Cách nối:</span> <span lang="ja">${esc(g.c)}</span></p><p class="muted">Nhóm: ${esc(GRAM_GROUPS[g.g] || '')}</p>
      <p lang="ja" class="gex">${grExHTML(g.x)} <button class="btn ghost sm" data-a="grSpeak" data-v="${esc(g.key)}" aria-label="Nghe câu ví dụ">🔊</button></p><p class="muted">${esc(g.v)}</p>
      ${g.n ? `<p class="exnote">${esc(g.n)}</p>` : ''}
      <div class="row">${grStarBtn(g.key)}<button class="btn sm" data-a="grOne" data-v="${esc(g.key)}">Luyện mẫu này (2 câu)</button></div></div></details>`;
  }).join('');
}
AFTER.grammar = () => {
  const i = $('#grq'); if (!i) return;
  i.oninput = () => { GL.q = i.value; GL.open = null; $('#grlist').innerHTML = grListHTML(); };
  $('#grlist').addEventListener('toggle', e => { const d = e.target; if (d.open) GL.open = d.dataset.k; else if (GL.open === d.dataset.k) GL.open = null; }, true);
};
function gpView() {
  const q = GP.q;
  return `<div class="rv-top"><button class="btn ghost sm" data-a="gpQuit">Thoát</button><span class="muted">${esc(GP.label)}</span><span class="num muted">${GP.i + 1}/${GP.ids.length}</span></div>
  <div class="rv-prog"><i style="width:${GP.i / GP.ids.length * 100}%"></i></div>
  <section class="panel">${grQHTML(q)}${q.shown ? `<button class="btn pri wide" data-a="gpNext">${GP.i + 1 < GP.ids.length ? 'Câu tiếp (Enter)' : 'Xem kết quả'}</button>` : ''}</section>`;
}
function gpSummary() {
  const ok = GP.res.filter(r => r[1]).length, n = GP.res.length, wrong = GP.res.filter(r => !r[1]).map(r => ITEM[r[0]] && grByKey(ITEM[r[0]].gk)).filter(Boolean);
  return `<section class="panel center"><div class="stamp ${pct(ok, n) >= 70 ? '' : 'grey'}">${pct(ok, n)}%</div><h2>${esc(GP.label)}: ${ok}/${n} câu đúng</h2>
    ${wrong.length ? `<div class="glist" style="text-align:left">${[...new Set(wrong)].map(g => `<div class="adv"><div><b lang="ja">${esc(g.p)}</b> <span class="muted">${esc(g.m)}</span></div>${grStarBtn(g.key)}</div>`).join('')}</div>` : ''}
    <div class="row center">${ok < n ? '<button class="btn pri" data-a="gpAgain">Làm lại câu sai</button>' : ''}<button class="btn" data-a="gpClose">Về Ngữ pháp</button><a class="btn ghost" href="#weak">Xem điểm yếu</a></div></section>`;
}
function gpNext() { if (GP.i + 1 >= GP.ids.length) { GP.done = true; render(); return; } GP.i++; GP.q = { id: GP.ids[GP.i], t0: Date.now() }; render(); scrollTo(0, 0); }
addEventListener('keydown', e => {
  if (e.key !== 'Enter' || route !== 'grammar' || !GP || GP.done || !GP.q.shown) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return; e.preventDefault(); gpNext();
});
Object.assign(ACT, {
  grRun(t) {
    const v = t.dataset.v;
    if (v === 'weak') return grStart(grWeakDue().slice(0, 15), 'Câu ngữ pháp sai');
    if (v === 'star') return grStart(shuffle(grPick('mix', 99, grList(grPLv()).filter(g => grStarred(g.key)).map(g => g.key))).slice(0, 15), 'Mẫu đã đánh dấu ★');
    grStart(grPick(v, v === 'mix' ? 15 : 10), v === 'GC' ? '文法形式の判断' : v === 'GO' ? '文の組み立て ★' : 'Ngữ pháp trộn');
  },
  grOne(t) {
    const k = t.dataset.v, g = grByKey(k); GL.open = k;
    if (!ITEM['gc:' + k]) { GL.lv = g.lv === curLv() ? null : g.lv; grIndex(); }   // mẫu ở cấp khác → chuyển cấp luyện sang cấp đó
    grStart(['gc:' + k, 'go:' + k], 'Luyện: ' + g.p);
  },
  grLv(t) { GL.lv = t.dataset.v === curLv() || t.dataset.v === GL.lv ? null : t.dataset.v; GL.open = null; grIndex(); render(); },
  grGr(t) { GL.gr = t.dataset.v; GL.open = null; render(); },
  grSpeak(t) { const g = grByKey(t.dataset.v); if (g) speak(grPlain(g.x)); },
  grStar(t) {
    const k = t.dataset.v, g = grByKey(k), on = grStarred(k);
    if (on) { delete S.phr[on]; S.pdel = [...new Set([...(S.pdel || []), on])]; toast('Đã bỏ khỏi Ôn nhanh'); }
    else { const id = 'g' + Date.now().toString(36); S.phr[id] = { t: g.p, n: `${g.m} · ${g.c}`, src: '', ctx: grPlain(g.x), at: Date.now(), s: null, gk: k }; toast('Đã thêm vào Ôn nhanh: ' + g.p); }
    save(); GL.open = k; render();
  },
  gqPick(t) { const q = gqCur(); if (!q || q.shown) return; q.pick = +t.dataset.v; gqDone(q); },
  gqTap(t) { const q = gqCur(); if (!q || q.shown) return; q.seq = [...(q.seq || []), +t.dataset.v].slice(0, 4); render(); },
  gqUndo() { const q = gqCur(); if (!q || q.shown) return; q.seq = (q.seq || []).slice(0, -1); render(); },
  gqCheck() { const q = gqCur(); if (!q || q.shown || (q.seq || []).length < 4) return; gqDone(q); },
  gpNext() { gpNext(); },
  gpQuit() { GP = GP.res.length ? { ...GP, done: true } : null; render(); },
  gpAgain() { grStart([...new Set(GP.res.filter(r => !r[1]).map(r => r[0]))], 'Làm lại câu sai'); },
  gpClose() { GP = null; render(); },
});
function grLvNow() { return GL.lv || (GRAM[curLv()] ? curLv() : 'all'); }
/* ===== BOOT ===== */
handlePairHash(); readHash(); render();
const CF_ON = CF.start();
if (!CF_ON) CF.status().then(() => { if (route === 'plan') render(); });
// Nội dung + danh sách file nằm trên máy (IndexedDB): đọc xong thì vẽ lại
Promise.all([loadContentDB(), localFilesLoad()]).then(([changed, lf]) => {
  if (changed || lf.size) { if (!busyView()) render(); }
  if (lf.size) askPersist();
  if (CF_ON && !Object.keys(CS).length) fetchContent().then(ok => { if (ok) render(); });
});
</script>

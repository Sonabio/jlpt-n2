<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B428F" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="JLPT N2">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lộ trình JLPT N2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sổ học trên giấy kẻ ô genkō — thanh bên trái (máy tính) / thanh dưới (điện thoại), nội dung một cột tối đa 1040px */
:root {
  --bg: #F2F3F7; --paper: #FFFFFF; --ink: #1B2140; --muted: #5E6480; --line: #DCDFEA; --grid: #E7EAF3;
  --ai: #2B428F; --ai-soft: #E4E9F7; --shu: #C8402A; --shu-soft: #FBE7E2;
  --good: #2E7D56; --good-soft: #E1F2E8; --warn: #A86A12; --bad: #B23A3A; --bad-soft: #F8E3E3;
  --f-body: "Be Vietnam Pro", "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-jp: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Be Vietnam Pro", sans-serif;
  --f-card: "Klee One", "Zen Kaku Gothic New", "Hiragino Mincho ProN", serif;
  --r: 10px; --shadow: 0 1px 2px rgb(20 30 70 / .06), 0 4px 14px rgb(20 30 70 / .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1220; --paper: #171B2C; --ink: #E6E8F2; --muted: #9BA1BC; --line: #2A3048; --grid: #20263B;
  --ai: #93A8FF; --ai-soft: #222B4D; --shu: #FF8466; --shu-soft: #3A2220;
  --good: #6BCB98; --good-soft: #17322A; --warn: #E7B45A; --bad: #FF8C8C; --bad-soft: #3A1E24;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1220; --paper: #171B2C; --ink: #E6E8F2; --muted: #9BA1BC; --line: #2A3048; --grid: #20263B;
  --ai: #93A8FF; --ai-soft: #222B4D; --shu: #FF8466; --shu-soft: #3A2220;
  --good: #6BCB98; --good-soft: #17322A; --warn: #E7B45A; --bad: #FF8C8C; --bad-soft: #3A1E24;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
[lang="ja"] { font-family: var(--f-jp); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: clamp(1.45rem, 3.4vw, 1.9rem); font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--ai); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .84rem; }
.center { text-align: center; }
mark { background: var(--shu-soft); color: var(--shu); border-radius: 3px; padding: 0 2px; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

/* shell */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--paper); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand .seal { width: 38px; height: 38px; border: 2px solid var(--shu); color: var(--shu); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-card); font-weight: 600; font-size: 1.05rem; transform: rotate(-8deg); flex: none; }
.brand b { display: block; font-size: .98rem; }
.brand small { color: var(--muted); font-size: .76rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nv { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.nv:hover { background: var(--ai-soft); }
.nv.on { background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.nvj { font-size: .8rem; color: var(--muted); width: 2.2em; }
.nv.on .nvj { color: var(--ai); }
.badge { margin-left: auto; background: var(--shu); color: #fff; border-radius: 999px; font-size: .7rem; padding: 0 7px; line-height: 1.6; font-weight: 600; font-variant-numeric: tabular-nums; }
.syncmini { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); padding: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot[data-m="cloud"] { background: var(--good); } .dot[data-m="error"] { background: var(--bad); } .dot[data-m="local"] { background: var(--warn); }
.main { min-width: 0; padding-block: 26px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#view { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 861px) { .main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: auto 0 0 0; top: auto; height: auto; z-index: 20; flex-direction: row; padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--line); gap: 0; }
  .brand, .syncmini { display: none; }
  .nav { flex-direction: row; flex: 1; justify-content: space-around; }
  .nv { flex: 1; flex-direction: column; align-items: center; gap: 0; padding: 7px 2px 6px; border-radius: 0; font-size: .7rem; min-width: 0; }
  .nv.on { background: transparent; }
  .nv.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ai); }
  .nvj { width: auto; font-size: 1rem; line-height: 1.3; color: var(--ink); }
  .nvv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .badge { position: absolute; top: 3px; right: 12%; margin: 0; font-size: .62rem; padding: 0 5px; }
  .main { padding-block: 18px calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* blocks */
.pt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pt span { font-size: .6em; color: var(--muted); font-weight: 500; }
.sh { margin-top: 6px; display: flex; gap: 10px; align-items: baseline; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph.sm h3 { font-size: .92rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.center { justify-content: center; }
.tag { font-size: .74rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.tag.on { color: var(--ai); border-color: var(--ai); }
.lv { font-size: .7rem; font-weight: 700; color: var(--ai); background: var(--ai-soft); border-radius: 4px; padding: 1px 6px; letter-spacing: .03em; white-space: nowrap; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.lnk { font-size: .88rem; }

.btn { font: inherit; font-size: .92rem; font-weight: 500; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 9px 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.btn:hover { border-color: var(--ai); }
.btn.pri { background: var(--ai); border-color: var(--ai); color: var(--paper); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ai); }
.btn.ghost:hover { background: var(--ai-soft); }
.btn.sm { padding: 5px 11px; min-height: 32px; font-size: .84rem; }
.btn.wide { width: 100%; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
.lnkb { font: inherit; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; text-align: left; }
.lnkb:hover { color: var(--ai); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; max-width: 100%; }
.seg button { font: inherit; font-size: .85rem; border: 0; background: var(--paper); color: var(--ink); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ai); color: var(--paper); }
.seg.sm button { padding: 3px 9px; font-size: .78rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip.on { background: var(--ai-soft); border-color: var(--ai); color: var(--ai); }
select, input[type=text], input[type=search], input[type=number], input[type=date], input:not([type]), textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
textarea { width: 100%; resize: vertical; font-size: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; color: var(--muted); }
.fld select, .fld input { color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: .92rem; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ai); flex: none; }
.check.big { font-size: 1rem; font-weight: 500; }
.check.today { font-weight: 600; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* today */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; padding: 4px 0 6px; }
.hero-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
.hero h1 span { color: var(--muted); font-weight: 500; font-size: .72em; display: block; margin-top: 2px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--shu); font-weight: 600; }
.count { display: grid; grid-template-columns: auto auto auto; align-items: baseline; gap: 2px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 18px; }
.count-n { font-family: var(--f-card); font-size: 2.8rem; line-height: 1; color: var(--shu); font-weight: 600; font-variant-numeric: tabular-nums; }
.count-l { font-size: 1rem; color: var(--muted); }
.count-d { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { display: flex; flex-direction: column; border-left: 2px solid var(--line); padding-left: 10px; }
.kpis b { font-size: 1.7rem; line-height: 1.15; font-weight: 600; }
.kpis span { font-size: .78rem; color: var(--muted); }
.sess { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.blocks li { display: grid; grid-template-columns: 36px 1fr; column-gap: 8px; font-size: .9rem; padding: 4px 8px; border-radius: 6px; }
.blocks li b { grid-row: span 2; color: var(--ai); font-variant-numeric: tabular-nums; }
.blocks small { color: var(--muted); font-size: .78rem; }
.blocks li.cur { background: var(--ai-soft); }
.blocks li.past { opacity: .5; }
.timer-s { font-size: 1.3rem; font-weight: 600; color: var(--ai); }
.done-msg { color: var(--good); font-weight: 500; }
.streak b { font-size: 1.5rem; color: var(--shu); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 96px; align-items: end; }
.bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.bar i { width: 100%; max-width: 18px; background: var(--ai-soft); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar.now i { background: var(--ai); }
.bar span { font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stages li { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; font-size: .88rem; }
.sn { font-weight: 600; }
.stages li.cur .sn { color: var(--shu); }
.sbar, .dk-bar, .rv-prog, .cbar { height: 6px; background: var(--grid); border-radius: 99px; overflow: hidden; display: flex; position: relative; }
.sbar i, .rv-prog i { background: var(--ai); display: block; }
.stages li.done .sbar i { background: var(--good); }
.sp { text-align: right; color: var(--muted); }

/* review */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.dk { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.dk-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dk-h b { font-weight: 600; font-size: .94rem; }
.dk-bar i.m { background: var(--ai); } .dk-bar i.s { background: color-mix(in srgb, var(--ai) 35%, transparent); }
.dk-f { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.dk-f .btn { margin-left: auto; }
.due { color: var(--shu); font-weight: 600; }
.rv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rv-prog i { transition: width .25s; }
.new { color: var(--shu); }
.flash {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: center;
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  min-height: min(52vh, 380px); padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; cursor: pointer;
}
.flash.flipped { cursor: default; justify-content: flex-start; }
.cf { font-family: var(--f-card); font-size: clamp(3.6rem, 16vw, 6.5rem); line-height: 1.1; font-weight: 600; background: var(--paper); padding: 0 10px; border-radius: 8px; max-width: 100%; overflow-wrap: anywhere; }
.cf.small { font-size: clamp(1.5rem, 6vw, 2.3rem); }
.cf.vi { font-family: var(--f-body); font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 600; }
.cf small { display: block; font-size: .5em; color: var(--muted); font-weight: 400; }
.flipped .cf { font-size: clamp(2.4rem, 10vw, 4rem); }
.flipped .cf.small { font-size: clamp(1.3rem, 5vw, 1.9rem); }
.tap { color: var(--muted); font-size: .84rem; background: var(--paper); padding: 2px 8px; border-radius: 6px; }
.cb { background: var(--paper); border-top: 2px solid var(--shu); width: min(100%, 560px); padding: 14px 6px 4px; display: flex; flex-direction: column; gap: 8px; }
.cb-main { font-size: 1.6rem; font-weight: 600; }
.cb-r { color: var(--muted); }
.cb-m { font-size: 1.3rem; font-weight: 600; color: var(--ai); }
.cb-n { color: var(--muted); font-size: .92rem; }
.cb-x { font-size: 1.05rem; background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.rv-act { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.g { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; }
.g b { font-weight: 600; } .g span { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.g1 { border-color: var(--bad); } .g1 b { color: var(--bad); }
.g2 b { color: var(--warn); } .g3 { border-color: var(--ai); } .g3 b { color: var(--ai); } .g4 b { color: var(--good); }
.g:hover { background: var(--bg); }
.stamp { display: inline-grid; place-items: center; width: 76px; height: 76px; border: 3px solid var(--shu); color: var(--shu); border-radius: 50%; font-family: var(--f-card); font-weight: 600; font-size: 1.6rem; transform: rotate(-10deg); margin: 0 auto 6px; letter-spacing: -.04em; }
.stamp.grey { border-color: var(--muted); color: var(--muted); }
.panel.center { align-items: center; }

/* practice */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.mode { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mh { display: flex; align-items: baseline; gap: 10px; }
.mj { font-family: var(--f-card); color: var(--shu); font-size: 1.05rem; font-weight: 600; min-width: 3.2em; }
.mode p { color: var(--muted); font-size: .88rem; }
.mf { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; }
.qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.qs { font-size: 1.3rem; line-height: 1.7; }
.qs.big { font-size: 2rem; font-family: var(--f-card); font-weight: 600; }
.qs.huge { font-size: 3.6rem; font-family: var(--f-card); font-weight: 600; line-height: 1.2; }
.qsub { color: var(--muted); }
.blank { color: var(--shu); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.opt { font: inherit; font-size: 1.02rem; text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 52px; }
.opt[lang="ja"] { font-family: var(--f-jp); font-size: 1.1rem; }
.opt:hover:not(:disabled) { border-color: var(--ai); }
.ok-n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); font-size: .72rem; display: grid; place-items: center; color: var(--muted); flex: none; font-family: var(--f-body); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrongp { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.opt:disabled { cursor: default; color: var(--ink); }
.expl { border-radius: 10px; padding: 12px 14px; font-size: .95rem; border-left: 3px solid; }
.expl.good { background: var(--good-soft); border-color: var(--good); }
.expl.bad { background: var(--bad-soft); border-color: var(--bad); }
.wrong { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.wi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.wi .qs { font-size: 1.05rem; } .wi .qs.big, .wi .qs.huge { font-size: 1.4rem; }
.wi .ok { color: var(--good); font-weight: 600; } .wi .exp { color: var(--muted); font-size: .88rem; }

/* lookup */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { font: inherit; font-size: .9rem; border: 0; background: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }

.search input { width: 100%; }

<script>
/* ===== UTIL ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jp = s => `<span lang="ja">${esc(s)}</span>`;
const pad = n => String(n).padStart(2, '0');
const dayNum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromDayNum = n => { const d = new Date(n * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const fmtDate = d => `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const unbr = s => s.replace(/[\[\]]/g, '');
const brHi = s => esc(s).replace(/\[(.+?)\]/g, '<mark>$1</mark>');
const isoWeek = (d = new Date()) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return `${t.getUTCFullYear()}-W${pad(Math.ceil(((t - y0) / 864e5 + 1) / 7))}`; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/[\[\]～〜()（）]/g, ' '));

  } catch (e) { toast('Thiết bị này chưa đọc được tiếng Nhật'); }
}

  }), false, 'kanji'));

/* Chuyển tiến độ cũ (khóa theo thứ tự) sang khóa theo chữ/từ */
function migrate(st) {
  if (!st) return st;
  if (st.set && !st.set.daily) st.set.daily = { w: 12, k: 3, g: 2 };
  if (!HAS_BULK || !st.srs) return st;
  const map = { kanji5: KANJI5, kanji4: KANJI4 };
  for (const k of Object.keys(st.srs)) { const m = k.match(/^(kanji5|kanji4):(\d+)$/); if (m && map[m[1]][+m[2]]) { const nk = 'k:' + map[m[1]][+m[2]][0]; if (!st.srs[nk]) st.srs[nk] = st.srs[k]; delete st.srs[k]; } }
  if (st.set && st.set.decks) st.set.decks = [...new Set(st.set.decks.map(id => id === 'kanji5' ? 'kj5' : id === 'kanji4' ? 'kj4' : id))];
  if (st.set && st.set.decks) { const out = []; st.set.decks.forEach(id => { out.push(id); const m = id.match(/^kj(\d)$/); if (m && !st.set.decks.includes('vb' + m[1])) out.push('vb' + m[1]); }); st.set.decks = [...new Set(out)]; }
  return st;
}

const today = () => dayNum();
function logAdd(field, n = 1) { const k = dayKey(); const l = S.log[k] || (S.log[k] = { r: 0, q: 0, c: 0, m: 0 }); l[field] = (l[field] || 0) + n; const dl = S.dlog || (S.dlog = {}); const dd = dl[DEV] || (dl[DEV] = {}); const x = dd[k] || (dd[k] = {}); x[field] = (x[field] || 0) + n; }
function newLeft() { const d = today(); return Math.max(0, S.set.newPer - (S.nw.d === d ? S.nw.c : 0)); }
/* FSRS-4.5 (tham số mặc định), độ chính xác theo ngày. Trạng thái: [due, ivl, D, S, reps, lapses, lastReview].
   Thẻ cũ dạng SM-2 [due, ivl, ease, reps, lapses] được chuyển đổi khi ôn lần kế tiếp. */
const FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const F_DECAY = -0.5, F_FACTOR = 19 / 81;
const clampD = d => Math.min(10, Math.max(1, d));
const fD0 = g => clampD(FW[4] - (g - 3) * FW[5]);
function fIvl(st) { const r = S.set.ret || 0.9; return Math.max(1, Math.min(3650, Math.round(st / F_FACTOR * (Math.pow(r, 1 / F_DECAY) - 1)))); }
function sched(st, g) {
  const dn = today();
  let D, Sx, reps = 0, lap = 0, last = dn, fresh = !st;
  if (st && st.length === 5) { const [due, ivl, ease, r, l] = st; Sx = Math.max(ivl, 0.5); D = clampD(11 - (ease - 1.3) / 1.5 * 9); reps = r; lap = l; last = due - ivl; }
  else if (st) { D = st[2]; Sx = st[3]; reps = st[4]; lap = st[5]; last = st[6]; }

  if (fresh) { nS = FW[g - 1]; nD = fD0(g); }

    const t = Math.max(0, dn - last), R = Math.pow(1 + F_FACTOR * t / Sx, F_DECAY);
    nD = clampD(FW[7] * fD0(3) + (1 - FW[7]) * (D - FW[6] * (g - 3)));
    if (g === 1) { nS = Math.min(Sx, FW[11] * Math.pow(D, -FW[12]) * (Math.pow(Sx + 1, FW[13]) - 1) * Math.exp(FW[14] * (1 - R))); lap++; }

  if (g === 1) return { st: [dn, 0, nD, nS, reps, lap, dn], again: true };
  const ivl = fIvl(nS);

}

function deckStats(d) {

  d.cards.forEach(c => { const s = S.srs[c.k]; if (!s) return; seen++; if (s[1] >= 21) mature++; if (s[0] <= dn) due++; });

}
function buildQueue(onlyDeck) {
  const dn = today();
  const pool = onlyDeck ? DECK[onlyDeck].cards : DECKS.flatMap(d => d.cards);
  const due = pool.filter(c => S.srs[c.k] && S.srs[c.k][0] <= dn).sort((a, b) => S.srs[a.k][0] - S.srs[b.k][0]);

const GODAN = { う: 'わいえお', く: 'かきけこ', ぐ: 'がぎげご', す: 'さしせそ', つ: 'たちてと', ぬ: 'なにねの', ぶ: 'ばびべぼ', む: 'まみめも', る: 'らりれろ' };
function conj(v, g, f) {
  g = +g;
  if (g === 3) {
    if (v.endsWith('来る')) {
      const p = v.slice(0, -2);
      const M = { masu: '来ます (きます)', nai: '来ない (こない)', te: '来て (きて)', ta: '来た (きた)', pot: '来られる (こられる)', vol: '来よう (こよう)', ba: '来れば (くれば)', imp: '来い (こい)', pass: '来られる (こられる)', caus: '来させる (こさせる)', cp: '来させられる (こさせられる)' };
      return p + M[f];
    }
    const p = v.slice(0, -2);
    const M = { masu: 'します', nai: 'しない', te: 'して', ta: 'した', pot: 'できる', vol: 'しよう', ba: 'すれば', imp: 'しろ', pass: 'される', caus: 'させる', cp: 'させられる' };
    return p + M[f];
  }
  const last = v.slice(-1), st = v.slice(0, -1);
  if (g === 2) {
    const M = { masu: 'ます', nai: 'ない', te: 'て', ta: 'た', pot: 'られる', vol: 'よう', ba: 'れば', imp: 'ろ', pass: 'られる', caus: 'させる', cp: 'させられる' };
    return st + M[f];
  }
  const row = GODAN[last]; if (!row) return v;
  const [a, i, e, o] = row;
  const teT = () => { if (v === '行く' || v.endsWith('行く')) return ['って', 'った']; if ('うつる'.includes(last)) return ['って', 'った']; if ('むぶぬ'.includes(last)) return ['んで', 'んだ']; if (last === 'く') return ['いて', 'いた']; if (last === 'ぐ') return ['いで', 'いだ']; return ['して', 'した']; };
  switch (f) {
    case 'masu': return st + i + 'ます';
    case 'nai': return st + a + 'ない';
    case 'te': return st + teT()[0];
    case 'ta': return st + teT()[1];
    case 'pot': return st + e + 'る';
    case 'vol': return st + o + 'う';
    case 'ba': return st + e + 'ば';
    case 'imp': return st + e;
    case 'pass': return st + a + 'れる';
    case 'caus': return st + a + 'せる';
    case 'cp': return st + a + (last === 'す' ? 'せられる' : 'される');
  }
}

  else if (/^[aeiouy]/.test(plain)) ini = HV_INITIAL[9];
  const ex = KANJI5.filter(k => k[1].split(/[ /]/).some(x => x === s));
  return `<div class="guess">
    ${ini ? `<div><span class="lbl">Phụ âm đầu</span><b>${esc(ini[0])} → ${esc(ini[1])}</b><small lang="ja">${esc(ini[2])}</small></div>` : ''}
    ${fin ? `<div><span class="lbl">Vần cuối</span><b>${esc(fin[0])} → ${esc(fin[1])}</b><small lang="ja">${esc(fin[2])}</small></div>` : ''}
    ${ex.length ? `<div><span class="lbl">Kanji N5 có âm này</span><b lang="ja">${ex.map(k => k[0] + ' ' + k[2]).join(' · ')}</b></div>` : ''}
    ${!ini && !fin ? '<p class="muted">Không khớp quy tắc nào.</p>' : ''}
  </div>`;
}

/* ===== EXAM ===== */
let EX = { run: false, part: 0, t0: 0, acc: 0, lv: 'N2' };
try { const e = JSON.parse(localStorage.getItem(LSK + '-timer') || 'null'); if (e) EX = { ...EX, ...e }; } catch (e) { }
const PARTS = [['Kiến thức ngôn ngữ + Đọc hiểu', 105], ['Nghe hiểu', 50]];
function exSave() { try { localStorage.setItem(LSK + '-timer', JSON.stringify(EX)); } catch (e) { } }
function exElapsed() { return EX.acc + (EX.run ? (Date.now() - EX.t0) / 1000 : 0); }
let wakeLock = null;
async function wake(on) { try { if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { } }
function drawExamTimer() {
  const el = $('#extimer'); if (!el) return;
  const tot = PARTS[EX.part][1] * 60, e = exElapsed(), rem = Math.max(0, tot - e);
  if (EX.run && rem <= 0) { EX.run = false; EX.acc = tot; exSave(); beep(); wake(false); }
  const min = e / 60;
  let note = '';
  if (EX.part === 0) note = min < 30 ? 'Đang ở phần Kiến thức ngôn ngữ: mục tiêu xong trong 30 phút.' : min < 100 ? 'Chuyển sang Đọc hiểu (~70 phút). Không quay lại câu khó quá 1 lần.' : '5 phút cuối: dò lại phiếu, không bỏ trống câu nào.';
  else note = 'Nghe hiểu: không quay lại câu đã qua; tô đáp án ngay.';
  el.innerHTML = `<div class="clock num ${rem < 300 ? 'late' : ''}">${pad(Math.floor(rem / 60))}:${pad(Math.floor(rem % 60))}</div>
    <div class="cbar"><i style="width:${Math.min(100, e / tot * 100)}%"></i>${EX.part === 0 ? '<b style="left:28.57%" title="30 phút"></b><b style="left:95.24%" title="100 phút"></b>' : ''}</div>
    <p class="cnote">${note}</p>
    <div class="row">${EX.run ? '<button class="btn" data-a="exPause">Tạm dừng</button>' : `<button class="btn pri" data-a="exStart" ${rem <= 0 ? 'disabled' : ''}>${e > 0 ? 'Tiếp tục' : 'Bắt đầu'}</button>`}<button class="btn ghost" data-a="exReset">Đặt lại</button></div>`;
}
function vExam() {

  </section>`;

function examChart(h) {
  const W = 640, H = 180, P = { l: 34, r: 12, t: 12, b: 26 };
  const xs = i => P.l + (h.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (h.length - 1));
  const ys = v => P.t + (1 - v / 180) * (H - P.t - P.b);
  const pass = judge(h[h.length - 1].lv, h[h.length - 1].s).need;
  const pts = h.map((x, i) => [xs(i), ys(judge(x.lv, x.s).total)]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổng điểm các đề thi thử">
    ${[0, 60, 120, 180].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${ys(v)}" y2="${ys(v)}" class="gl"/><text x="${P.l - 6}" y="${ys(v) + 4}" text-anchor="end" class="ax">${v}</text>`).join('')}
    <line x1="${P.l}" x2="${W - P.r}" y1="${ys(pass)}" y2="${ys(pass)}" class="passl"/><text x="${W - P.r}" y="${ys(pass) - 5}" text-anchor="end" class="ax shu">đỗ ${pass}</text>
    ${pts.length > 1 ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" class="ln" fill="none"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" class="dot"/><text x="${p[0]}" y="${H - 8}" text-anchor="middle" class="ax">${h[i].d.slice(5).replace('-', '/')}</text>`).join('')}
  </svg></div>`;
}

let CU_DEL = null;
function parseCSV(text) {
  const out = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const sep = line.includes(';') ? ';' : line.includes('\t') ? '\t' : ',';
    const c = line.split(sep).map(x => x.trim().replace(/^"(.*)"$/, '$1').replace(/<br\s*\/?>/gi, ' · ').replace(/<[^>]+>/g, ''));
    if (!c[0] || /^(front|mặt trước|tiếng nhật)$/i.test(c[0])) return;
    if (c.length === 1) return;
    if (c.length === 2) out.push({ f: c[0], r: '', m: c[1], x: '' });
    else if (c.length === 3) out.push({ f: c[0], r: c[1], m: c[2], x: '' });
    else out.push({ f: c[0], r: c[1], m: c[2], x: c.slice(3).join(sep === ',' ? ', ' : ' ') });
  });
  return out;
}
function addCustom(cards) {
  S.custom = S.custom || []; const have = new Set(S.custom.map(c => c.f + '|' + c.m)); let n = 0;
  cards.forEach(c => { if (!c.f || !c.m || have.has(c.f + '|' + c.m)) return; S.custom.push({ ...c, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }); have.add(c.f + '|' + c.m); n++; });
  if (n && !S.set.decks.includes('mine')) S.set.decks = ['mine', ...S.set.decks];
  buildCustom(); save(); return n;
}

    let v = inp.value; if (S.set.romaji) v = romajiToKana(v, true);
    if (!v.trim()) { toast('Hãy gõ đáp án, hoặc bấm Không biết'); return; }
    const ok = isRight(v, q.answers), hint = FL.hintUsed === c.k;
    FL.typed = { v, ok, hint }; if (!ok) FL.err[c.k] = (FL.err[c.k] || 0) + 1; else if (hint) FL.err[c.k] = (FL.err[c.k] || 0) + 1;
    logAdd('tn'); if (ok) logAdd('tc'); render();
  },
  tyMode(t) { TYP.mode = t.dataset.v; render(); },
  tyLv(t) { TYP.lv = t.dataset.v; render(); },
  tyOS(t) { TYP.os = t.dataset.v; render(); },
  tyStart() { startTyping(); },
  tyClose() { if (TY && TY.res.length) { const acc = Math.round(TY.res.reduce((a, r) => a + r.acc, 0) / TY.res.length), chars = TY.res.reduce((a, r) => a + r.len, 0), sec = TY.res.reduce((a, r) => a + r.sec, 0); if (!TY.saved) { S.typing = S.typing || []; S.typing.push({ d: dayKey(), mode: TY.mode, lv: TY.lv, n: TY.res.length, acc, cpm: sec ? Math.round(chars / sec * 60) : 0 }); S.typing = S.typing.slice(-200); save(); } } TY = null; render(); },
  tySay() { speak(TY.items[TY.i].say); },

  tyCheck() { tyCheck(); },
  tyNext() { TY.i++; TY.cur = null; TY.t0 = 0; if (TY.i >= TY.items.length && !TY.saved) { const acc = Math.round(TY.res.reduce((a, r) => a + r.acc, 0) / TY.res.length), chars = TY.res.reduce((a, r) => a + r.len, 0), sec = TY.res.reduce((a, r) => a + r.sec, 0); S.typing = S.typing || []; S.typing.push({ d: dayKey(), mode: TY.mode, lv: TY.lv, n: TY.res.length, acc, cpm: sec ? Math.round(chars / sec * 60) : 0 }); S.typing = S.typing.slice(-200); TY.saved = true; save(); } render(); },
  setRomaji(t) { S.set.romaji = t.checked; save(); },
  setDaily(t) { S.set.daily = { ...(S.set.daily || {}), [t.dataset.k]: +t.value }; save(); },
  setDev(t) { S.set.dev = t.value; save(); render(); },
  setTypeRev(t) { S.set.typeRev = t.checked; save(); },

function revTypeSpec(c) {
  const kd = kindOf(c);
  if (kd === 'kanji') return c.ew && c.er ? { q: `Gõ cách đọc của <b lang="ja">${esc(c.ew)}</b>`, answers: [c.er] } : { q: 'Gõ một cách đọc On/Kun', answers: [...String(c.on || '').split('・'), ...String(c.kun || '').split('・')].filter(Boolean) };
  if (kd === 'vocab' && c.r) return { q: 'Gõ cách đọc', answers: [c.r, c.f] };

document.addEventListener('keydown', e => {

/* ===== ĐỒNG BỘ: gộp dữ liệu giữa các máy + Cloudflare (Worker + D1) ===== */
const DEV = (() => { try { let d = localStorage.getItem('jlpt-n2-dev'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('jlpt-n2-dev', d); } return d; } catch (e) { return 'nodev'; } })();
const LOCAL_SET_KEYS = ['dev', 'romaji', 'typeRev'];

/* Nhật ký học lưu riêng theo máy (S.dlog[máy][ngày]) rồi cộng lại thành S.log, để 2 máy cùng học một ngày không ghi đè nhau */
function ensureDlog(st) { if (!st.dlog) { st.dlog = {}; if (st.log && Object.keys(st.log).length) st.dlog.legacy = JSON.parse(JSON.stringify(st.log)); } return st; }
function rebuildLog(st) {
  const out = {};
  Object.values(st.dlog || {}).forEach(days => Object.entries(days || {}).forEach(([d, l]) => { const o = out[d] || (out[d] = {}); Object.entries(l || {}).forEach(([f, v]) => { o[f] = (o[f] || 0) + (+v || 0); }); }));
  st.log = out; return st;
}
const srsCount = s => s.length === 7 ? (s[4] || 0) + (s[5] || 0) : (s[3] || 0) + (s[4] || 0);
const srsLast = s => s.length === 7 ? (s[6] || 0) : (s[0] || 0) - (s[1] || 0);
function pickSrs(x, y) { if (!x) return y; if (!y) return x; const a = srsCount(x), b = srsCount(y); if (a !== b) return a > b ? x : y; const la = srsLast(x), lb = srsLast(y); if (la !== lb) return la > lb ? x : y; return (x[0] || 0) >= (y[0] || 0) ? x : y; }
function unionBy(a = [], b = [], key) { const m = new Map(); [...a, ...b].forEach(x => { const k = key(x); if (!m.has(k)) m.set(k, x); }); return [...m.values()]; }
function mergeState(local, remote) {
  if (!remote) return local;
  const a = ensureDlog(JSON.parse(JSON.stringify(local))), b = ensureDlog(migrate(JSON.parse(JSON.stringify(remote))));
  const o = { ...a };
  o.srs = { ...a.srs }; Object.entries(b.srs || {}).forEach(([k, v]) => { o.srs[k] = pickSrs(a.srs[k], v); });
  o.dlog = { ...a.dlog };
  Object.entries(b.dlog || {}).forEach(([dev, days]) => {
    if (dev === DEV) return; // nhật ký của chính máy này: bản trên máy luôn mới nhất
    const mine = o.dlog[dev] || {}; const merged = { ...mine };
    Object.entries(days || {}).forEach(([d, l]) => { const x = { ...(mine[d] || {}) }; Object.entries(l || {}).forEach(([f, v]) => { x[f] = Math.max(x[f] || 0, +v || 0); }); merged[d] = x; });
    o.dlog[dev] = merged;
  });
  rebuildLog(o);
  o.exams = unionBy(a.exams, b.exams, x => x.id || JSON.stringify(x));
  o.place = unionBy(a.place, b.place, x => x.d + '|' + x.min + '|' + JSON.stringify(x.lv));
  o.typing = unionBy(a.typing, b.typing, x => JSON.stringify(x)).slice(-300);
  o.cdel = [...new Set([...(a.cdel || []), ...(b.cdel || [])])];
  o.custom = unionBy(a.custom, b.custom, x => x.id).filter(c => !o.cdel.includes(c.id));
  o.week = { ...(a.week || {}) }; Object.entries(b.week || {}).forEach(([w, days]) => { o.week[w] = { ...(o.week[w] || {}) }; Object.entries(days || {}).forEach(([d, v]) => { if (v) o.week[w][d] = true; }); });
  o.chk = { ...(a.chk || {}) }; Object.entries(b.chk || {}).forEach(([k, v]) => { if (v) o.chk[k] = true; });
  o.qs = { ...(a.qs || {}) }; Object.entries(b.qs || {}).forEach(([k, v]) => { if (!o.qs[k] || (v.n || 0) > (o.qs[k].n || 0)) o.qs[k] = v; });
  if ((b.setUpd || 0) > (a.setUpd || 0)) { const keep = {}; LOCAL_SET_KEYS.forEach(k => { if (k in a.set) keep[k] = a.set[k]; }); o.set = { ...a.set, ...b.set, ...keep }; o.setUpd = b.setUpd; }
  o.upd = Math.max(a.upd || 0, b.upd || 0);
  return o;
}

/* ----- Cloudflare ----- */
const CF = {
  KEY: 'jlpt-n2-cf', cfg: null, rev: 0, busy: false, again: false, t: 0, lastOk: 0, pair: null, recovery: null, hasOwner: null, on: false,
  load() { try { this.cfg = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { this.cfg = null; } return this.cfg; },
  store() { try { this.cfg ? localStorage.setItem(this.KEY, JSON.stringify(this.cfg)) : localStorage.removeItem(this.KEY); } catch (e) { } },
  async call(path, opts = {}) {
    const r = await fetch('/api' + path, { method: opts.method || 'GET', body: opts.body ? JSON.stringify(opts.body) : undefined, keepalive: !!opts.keepalive, cache: 'no-store', headers: { 'content-type': 'application/json', ...(this.cfg && this.cfg.key ? { authorization: 'Bearer ' + this.cfg.key } : {}) } });
    let j = null; try { j = await r.json(); } catch (e) { }
    if (!r.ok) { const e = new Error((j && j.message) || ('HTTP ' + r.status)); e.status = r.status; e.code = j && j.error; throw e; }
    return j;
  },
  async status() { try { const s = await this.call('/status'); this.hasOwner = s.hasOwner; } catch (e) { this.hasOwner = null; } return this.hasOwner; },
  schedule(ms = 15000) { if (!this.cfg) return; clearTimeout(this.t); this.t = setTimeout(() => this.sync(), Date.now() - this.lastOk > 60000 ? 3000 : ms); },
  async sync(opts = {}) {
    if (!this.cfg) return false;
    if (this.busy) { this.again = true; return false; }
    this.busy = true; let changed = false;
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const g = await this.call('/sync');
        let remote = null; if (g.data) { try { remote = JSON.parse(g.data); } catch (e) { } }
        const before = JSON.stringify(S);
        if (remote) { S = mergeState(S, remote); buildCustom(); try { localStorage.setItem(LSK, JSON.stringify(S)); } catch (e) { } }
        if (JSON.stringify(S) !== before) changed = true;
        const data = JSON.stringify(S);
        if (data === g.data) { this.rev = g.rev; break; }
        let summary = null; try { summary = weeklySummary(); } catch (e) { }
        try { const r = await this.call('/sync', { method: 'PUT', body: { data, upd: S.upd, baseRev: g.rev, summary }, keepalive: !!opts.keepalive && data.length < 60000 }); this.rev = r.rev; break; }
        catch (e) { if (e.status !== 409) throw e; }
      }
      this.lastOk = Date.now();
      setSync('cloud', 'Đã đồng bộ ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' (Cloudflare)');
      if (changed) rerenderAfterRemote();
    } catch (e) {
      if (e.status === 401) { this.cfg = null; this.store(); SY.kind = null; setSync('error', 'Máy này đã bị ngắt (khóa đồng bộ đã đổi). Hãy ghép lại ở mục Kế hoạch.'); }
      else setSync(navigator.onLine === false ? 'local' : 'error', navigator.onLine === false ? 'Đang offline. Tiến độ lưu trên máy, sẽ đồng bộ khi có mạng.' : 'Chưa đồng bộ được (' + (e.message || 'lỗi mạng') + '). Tiến độ vẫn lưu trên máy.');
    }
    this.busy = false;
    if (this.again) { this.again = false; this.schedule(2000); }
    return changed;
  },
  start(noSync) {
    if (!this.load()) return false;
    SY.kind = 'cf'; setSync('local', 'Đang đồng bộ với Cloudflare…'); if (!noSync) this.sync();
    if (!this.on) {
      this.on = true;
      document.addEventListener('visibilitychange', () => { if (!this.cfg) return; if (document.visibilityState === 'visible') this.sync(); else this.sync({ keepalive: true }); });
      window.addEventListener('online', () => this.cfg && this.sync());
      setInterval(() => { if (this.cfg && document.visibilityState === 'visible') this.sync(); }, 120000);
    }
    return true;
  },
  async connectWith(key, label) {
    this.cfg = { key, at: Date.now(), label }; this.store();
    if (GIST.load() && GIST.cfg && GIST.cfg.id) { try { const d = await GIST.pull(); if (d && d.s) { S = mergeState(S, JSON.parse(d.s)); buildCustom(); } } catch (e) { } GIST.cfg = null; GIST.store(); }
    this.start(true); await this.sync(); render();
  },
  async init() { const r = await this.call('/space/init', { method: 'POST' }); this.recovery = r.recovery; await this.connectWith(r.key, 'máy đầu tiên'); },
  async claim(code) { const r = await this.call('/pair/claim', { method: 'POST', body: { code } }); await this.connectWith(r.key, 'ghép bằng mã'); },
  async recover(code) { const r = await this.call('/space/recover', { method: 'POST', body: { recovery: code } }); await this.connectWith(r.key, 'khôi phục'); },
  async createPair() { this.pair = await this.call('/pair/create', { method: 'POST' }); return this.pair; },
  async rotate() { const r = await this.call('/space/rotate', { method: 'POST' }); this.cfg.key = r.key; this.store(); this.pair = null; },
  disconnect() { this.cfg = null; this.store(); SY.kind = null; this.pair = null; setSync('local', 'Đã ngắt đồng bộ trên máy này. Tiến độ vẫn lưu trên máy.'); },
};

let SYU = { busy: false, confirmRotate: false, showGist: false };
function syncUI() {
  if (IN_CLAUDE) return '';
  const c = CF.cfg;
  if (c) {
    const p = CF.pair && CF.pair.exp > Date.now() ? CF.pair : null;
    return `<div class="gist">
      <p><b>Đồng bộ Cloudflare đang bật trên máy này.</b> Dữ liệu được gộp theo từng thẻ, nên học trên cả hai máy (kể cả lúc offline) đều không mất.</p>
      ${CF.recovery ? `<div class="expl bad"><b>Lưu mã khôi phục này</b> (chụp màn hình hoặc ghi vào trình quản lý mật khẩu). Dùng khi mất hết các máy đã ghép: <code class="big">${esc(CF.recovery)}</code><div class="row"><button class="btn sm" data-a="cfRecOk">Mình đã lưu</button></div></div>` : ''}
      ${p ? `<div class="pairbox"><p>Trên máy kia: mở app → Kế hoạch → <b>Nhập mã ghép</b>:</p><p class="paircode num">${esc(p.code)}</p><div id="qr" class="qr" aria-label="Mã QR để ghép"></div><p class="hint">Hết hạn lúc ${new Date(p.exp).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}. Quét QR mở bằng trình duyệt; với app đã cài trên iPhone hãy nhập mã trong app.</p></div>` : ''}

      ${SYU.confirmRotate ? '<button class="btn danger" data-a="cfRotateYes">Đổi khóa: các máy khác phải ghép lại</button><button class="btn ghost" data-a="cfRotateNo">Hủy</button>' : '<button class="btn ghost" data-a="cfRotate">Đổi khóa (ngắt mọi máy khác)</button>'}
      <button class="btn ghost" data-a="cfOff">Ngắt máy này</button></div>
    </div>`;
  }
  const g = GIST.load() && GIST.cfg && GIST.cfg.id;
  return `<div class="gist">
    <p><b>Đồng bộ điện thoại ↔ laptop (Cloudflare).</b> Làm một lần: bật trên máy đầu tiên, rồi ghép máy còn lại bằng mã 8 ký tự.</p>
    ${g ? '<p class="hint">Máy này đang dùng GitHub Gist (cách cũ). Khi bật Cloudflare, dữ liệu trên gist được gộp vào rồi ngắt gist.</p>' : ''}
    ${CF.hasOwner === false ? '<div class="row"><button class="btn pri" data-a="cfInit">Bật đồng bộ (máy đầu tiên)</button></div>' : ''}
    <label class="fld" for="cf-code">${CF.hasOwner === false ? 'Hoặc nhập mã ghép' : 'Nhập mã ghép từ máy đã kết nối'}<div class="row"><input id="cf-code" class="num" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="9" style="flex:1;min-width:0"><button class="btn${CF.hasOwner === false ? '' : ' pri'}" data-a="cfClaim">Ghép máy này</button></div></label>
    <details><summary class="hint">Mất hết các máy? Dùng mã khôi phục</summary><div class="row"><input id="cf-rec" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:0"><button class="btn" data-a="cfRecover">Khôi phục</button></div></details>
    ${CF.hasOwner === null ? '<p class="hint">Chưa kết nối được máy chủ đồng bộ (offline hoặc máy chủ chưa sẵn sàng).</p>' : ''}
    ${g ? `<p class="hint">Gist cũ: <button class="lnkb lnk" data-a="gistOff">ngắt gist</button></p>` : ''}
  </div>`;
}
function drawQR() {
  const el = $('#qr'); if (!el || !CF.pair || typeof qrcode !== 'function') return;
  try { const q = qrcode(0, 'M'); q.addData(location.origin + location.pathname + '#pair-' + CF.pair.code.replace('-', '')); q.make(); el.innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch (e) { el.textContent = ''; }
}
function loadQR() { if (typeof qrcode === 'function') return Promise.resolve(); return new Promise(res => { const s = document.createElement('script'); s.src = 'vendor/qrcode.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
async function cfRun(fn, okMsg) { if (SYU.busy) return; SYU.busy = true; try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message || 'Lỗi mạng'); } SYU.busy = false; render(); }
Object.assign(ACT, {
  cfInit() { cfRun(() => CF.init(), 'Đã bật đồng bộ. Hãy lưu mã khôi phục.'); },
  cfClaim() { const v = ($('#cf-code') || {}).value || ''; if (v.replace(/[^A-Za-z0-9]/g, '').length !== 8) { toast('Mã ghép gồm 8 ký tự, ví dụ ABCD-2345'); return; } cfRun(() => CF.claim(v), 'Đã ghép máy này và gộp dữ liệu'); },
  cfRecover() { const v = ($('#cf-rec') || {}).value || ''; cfRun(() => CF.recover(v), 'Đã khôi phục. Các máy cũ cần ghép lại.'); },
  cfPair() { cfRun(async () => { await CF.createPair(); await loadQR(); }); },
  cfSync() { cfRun(() => CF.sync(), 'Đã đồng bộ'); },
  cfRotate() { SYU.confirmRotate = true; render(); },
  cfRotateNo() { SYU.confirmRotate = false; render(); },
  cfRotateYes() { SYU.confirmRotate = false; cfRun(() => CF.rotate(), 'Đã đổi khóa. Máy khác cần ghép lại.'); },
  cfOff() { CF.disconnect(); render(); },
  cfRecOk() { CF.recovery = null; render(); },
});
/* Mở link #pair-XXXXXXXX (từ QR) → tự ghép */
function handlePairHash() {
  const m = location.hash.match(/^#pair-([A-Za-z0-9]{8})$/); if (!m || IN_CLAUDE) return false;
  history.replaceState(null, '', location.pathname + '#plan');
  if (CF.load()) { toast('Máy này đã được ghép rồi'); return false; }
  cfRun(() => CF.claim(m[1]), 'Đã ghép máy này và gộp dữ liệu');
  return true;
}
/* ===== BOOT ===== */
buildCustom(); handlePairHash(); readHash(); render(); initSync();
